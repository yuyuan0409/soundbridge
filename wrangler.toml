# Cloudflare Workers + Durable Objects 配置
# 部署：
#   npx wrangler login
#   npx wrangler deploy
#
# Worker 会给一个长期地址：
#   https://<worker-name>.<account-subdomain>.workers.dev
#
# 自定义域名可在 Cloudflare Dashboard -> Workers -> Settings -> Domains & Routes 绑定。

name = "soundbridge"
main = "worker/index.js"
compatibility_date = "2025-04-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[durable_objects]
bindings = [
  { name = "ROOMS", class_name = "RoomHub" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomHub"]

[vars]
# 部署后可以改成 workers.dev 地址或自己的域名；留空时使用请求的 origin
# 故意不用 PUBLIC_URL，避免与 Node 版本 .env 中的临时隧道地址冲突
CF_PUBLIC_URL = ""
STUN_URLS = "stun:stun.l.google.com:19302"

[observability]
enabled = true
